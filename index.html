<style>
:root{--bg:#07101f;--panel:#101a2d;--line:rgba(160,190,255,.18);--text:#f4f7ff;--muted:#9eb4d8;--accent:#69a6ff;--yellow:#ffd65a;--danger:#ff6575;--ok:#72e39a;--warn:#ffbd59;--shadow:0 18px 50px rgba(0,0,0,.35);--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top left,#18294b 0,#07101f 38%,#050a15 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.topin{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}

.tabs{display:flex;gap:8px;overflow:auto;padding:0 18px 14px;max-width:1500px;margin:0 auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:rgba(13,23,41,.86);border-radius:999px;padding:10px 14px;font-weight:900}.tab.active{color:#06101f;background:linear-gradient(135deg,#ffd65a,#ffad42);border-color:#ffe28a}

.grid{display:grid;gap:16px}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.panel{background:linear-gradient(180deg,rgba(20,34,57,.98),rgba(13,22,39,.98));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.head{padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:22px}.head p{margin:5px 0 0;color:var(--muted);font-size:14px}.body{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:rgba(13,23,41,.92);border:1px solid var(--line);border-radius:18px;padding:15px}.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}.kpi .num{font-size:30px;font-weight:950;margin-top:5px}.kpi .sub{color:var(--muted);font-size:13px;margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;overflow:visible;padding-bottom:0}.strip::-webkit-scrollbar{display:none}.pill{white-space:normal;border:1px solid var(--line);background:#0c1526;color:var(--text);border-radius:999px;padding:9px 12px;font-weight:850;width:100%;min-height:42px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.15}.pill.active{background:#1f70e8;border-color:#6eabff}.pill.good{border-color:rgba(114,227,154,.7);color:#9ff0ba}.pill.danger{border-color:rgba(255,101,117,.8);color:#ffa1aa}.pill.warn{border-color:rgba(255,189,89,.8);color:#ffd27d}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}.side{display:grid;gap:12px;position:sticky;top:126px}.match-card{border:1px solid var(--line);background:rgba(13,23,41,.88);border-radius:18px;padding:13px;display:grid;gap:8px;text-align:left;color:var(--text)}.match-card.active{border-color:#6eabff;box-shadow:0 0 0 2px rgba(105,166,255,.16)}.mtitle{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:950}.status{font-size:12px;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 8px;font-weight:850}.status.done{color:#061b0d;background:#72e39a;border-color:#72e39a}.status.open{color:#ffe0a1;border-color:rgba(255,189,89,.7)}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;color:var(--muted);font-size:13px}.scoreline b{color:var(--text)}
.game{background:rgba(9,18,33,.95);border:1px solid var(--line);border-radius:18px;overflow:hidden}.ghead{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;padding:14px;background:rgba(20,34,57,.7)}.ghead h3{margin:0;font-size:16px}

.note{color:var(--muted);font-size:12px;margin-top:8px;min-height:17px}.bad{color:#ffa1aa!important}.ok{color:#9ff0ba!important}.dup-input{border-color:#ff6575!important;box-shadow:0 0 0 3px rgba(255,101,117,.22)!important;background:#2a0f1a!important}.dup-card{border-color:#ff6575!important;box-shadow:0 0 0 3px rgba(255,101,117,.22),0 0 18px rgba(255,101,117,.45)!important}.dup-badge{position:absolute;right:3px;top:3px;background:#ff6575;color:#fff;border:1px solid rgba(255,255,255,.65);border-radius:999px;font-size:10px;font-weight:950;padding:2px 5px}.deck-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ghost{background:#101b31}.overlap-warn{margin-top:8px;border-color:rgba(255,189,89,.65)!important;background:rgba(116,74,17,.22)!important}.copy-hint{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:720px;background:rgba(13,23,41,.8)}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:#b9cced;font-size:12px;text-transform:uppercase;letter-spacing:.07em;background:#101d33;position:sticky;top:0}tr:last-child td{border-bottom:none}
.notice{border:1px solid var(--line);background:rgba(13,23,41,.9);border-radius:16px;padding:14px;color:#cfe0ff}.notice.good{border-color:rgba(114,227,154,.45);background:rgba(22,80,47,.25)}.notice.warn{border-color:rgba(255,189,89,.55);background:rgba(116,74,17,.25)}.notice.danger{border-color:rgba(255,101,117,.55);background:rgba(118,28,42,.25)}

.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}.libcard{border:1px solid var(--line);background:rgba(13,23,41,.85);border-radius:14px;padding:8px;min-width:0}.libcard .cimg{height:112px;min-height:112px;margin-bottom:7px}.libcard b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.libcard span{color:var(--muted);font-size:11px}

.minirow{display:grid;grid-template-columns:repeat(8,38px);gap:5px;overflow:auto}.minirow .cimg{width:38px;min-width:38px;height:50px;min-height:50px;border-radius:7px}.minirow .cost{display:none}.checkitem{border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(13,23,41,.75);display:grid;grid-template-columns:minmax(120px,180px) 1fr auto;gap:12px;align-items:center}

.picker.show{display:block}.picker-head{padding:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.picker-grid{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:470px;overflow:auto}.pick-card{border:1px solid var(--line);background:#101b31;color:var(--text);border-radius:13px;padding:6px;display:grid;gap:5px;text-align:center}.pick-card:hover{border-color:#69a6ff}.pick-card .cimg{height:86px;min-height:86px}.pick-card b{font-size:11px;line-height:1.1;min-height:24px}.picker-close{border:1px solid var(--line);background:#142239;color:#fff;border-radius:10px;padding:8px 10px}

.builder-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.builder-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;max-height:360px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(9,18,33,.75)}.builder-card-choice{border:1px solid var(--line);background:#101b31;color:var(--text);border-radius:13px;padding:6px;display:grid;gap:5px;text-align:center;position:relative}.builder-card-choice .cimg{height:76px;min-height:76px}.builder-card-choice b{font-size:11px;line-height:1.1;min-height:24px}.builder-card-choice.include{border-color:#72e39a;box-shadow:0 0 0 2px rgba(114,227,154,.22)}.builder-card-choice.exclude{border-color:#ff6575;box-shadow:0 0 0 2px rgba(255,101,117,.22);opacity:.75}.builder-card-choice .mark{position:absolute;top:5px;right:5px;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:950;color:white}.builder-card-choice.include .mark{background:#198754}.builder-card-choice.exclude .mark{background:#c83245}.built-deck{display:grid;grid-template-columns:repeat(8,minmax(52px,1fr));gap:8px}.builder-result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.builder-mini{font-size:13px;color:var(--muted);line-height:1.45}.builder-selected{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}.chip{border:1px solid var(--line);background:#0c1526;color:var(--text);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:850}.chip.good{border-color:rgba(114,227,154,.65);color:#9ff0ba}.chip.danger{border-color:rgba(255,101,117,.65);color:#ffa1aa}@media(max-width:760px){.builder-controls{grid-template-columns:1fr}.builder-card-grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:330px}.builder-card-choice .cimg{height:82px;min-height:82px}.built-deck{grid-template-columns:repeat(4,1fr)}}
.played-card-tools{display:grid;gap:10px;margin-top:12px}.played-card-list{display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;background:rgba(9,18,33,.55)}.played-card-list .chip{font-size:11px}.builder-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.deck-exclude-selector{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.deck-exclude-preview{display:grid;grid-template-columns:repeat(8,minmax(34px,1fr));gap:5px;margin-top:10px}.deck-exclude-preview .cimg{min-height:58px;height:58px}.deck-exclude-preview .cost{display:none}.deck-exclude-empty{color:var(--muted);font-size:13px;margin-top:8px}@media(max-width:760px){.deck-exclude-selector{grid-template-columns:1fr 1fr}.deck-exclude-preview{grid-template-columns:repeat(4,1fr)}.deck-exclude-preview .cimg{min-height:74px;height:74px}}

/* Deckbauer formatting update */
#page-builder .panel{overflow:visible}
#page-builder .head{align-items:center}
#page-builder .head h2{margin-bottom:0}
#page-builder .builder-controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
#page-builder .builder-controls>div{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(9,18,33,.58);min-width:0}
#page-builder .builder-card-grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));max-height:285px;overflow:auto;padding:10px}
#page-builder .builder-card-choice{min-width:0}
#page-builder .builder-card-choice .cimg{height:88px;min-height:88px}
#page-builder .builder-card-choice b{font-size:11px}
#page-builder .builder-result-actions{margin-top:14px}
#page-builder .played-card-tools{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(9,18,33,.58);margin-top:16px}
#page-builder .deck-exclude-selector{display:grid;grid-template-columns:minmax(130px,1fr) minmax(130px,1fr) minmax(120px,1fr) auto;gap:10px;align-items:end}
#page-builder .deck-exclude-selector label{display:grid;gap:5px;color:var(--muted);font-size:13px}
#page-builder .deck-exclude-selector .row{display:grid;grid-template-columns:1fr;gap:8px;min-width:190px}
#page-builder .deck-exclude-preview{grid-template-columns:repeat(8,minmax(54px,72px));gap:7px;margin-top:12px;overflow:visible}
#page-builder .deck-exclude-preview .cimg{min-height:92px;height:92px}
#page-builder .deck-exclude-preview .cimg img{object-fit:contain}
#page-builder .built-deck{grid-template-columns:repeat(8,minmax(72px,1fr));gap:10px}
#page-builder .built-deck .cimg{min-height:102px;height:102px}
@media(max-width:980px){
  #page-builder .builder-controls{grid-template-columns:1fr}
  #page-builder .deck-exclude-selector{grid-template-columns:1fr 1fr}
  #page-builder .deck-exclude-selector .row{grid-column:1/-1;grid-template-columns:1fr 1fr;min-width:0}
  #page-builder .deck-exclude-preview{grid-template-columns:repeat(4,1fr)}
  #page-builder .built-deck{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:760px){
  #page-builder .builder-card-grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:330px}
  #page-builder .builder-card-choice .cimg{height:92px;min-height:92px}
  #page-builder .deck-exclude-selector{grid-template-columns:1fr}
  #page-builder .deck-exclude-selector .row{grid-template-columns:1fr}
  #page-builder .deck-exclude-preview{grid-template-columns:repeat(4,1fr)}
  #page-builder .deck-exclude-preview .cimg{min-height:92px;height:92px}
  #page-builder .built-deck .cimg{min-height:112px;height:112px}
}


/* Deckbauer compact card preview fix */
#page-builder .deck-exclude-preview{
  display:grid;
  grid-template-columns:repeat(8, minmax(54px, 72px)) !important;
  gap:7px !important;
  align-items:start !important;
  justify-content:start !important;
  overflow:visible !important;
}
#page-builder .deck-exclude-preview .cimg{
  width:72px !important;
  height:92px !important;
  min-height:92px !important;
  max-height:92px !important;
  border-radius:10px !important;
  overflow:hidden !important;
}
#page-builder .deck-exclude-preview .cimg img{
  width:100% !important;
  height:100% !important;
  object-fit:contain !important;
  padding:4px !important;
}
#page-builder .deck-exclude-preview .fallback{
  font-size:9px !important;
}
#page-builder .deck-exclude-preview .empty{
  font-size:18px !important;
}
#page-builder .deck-exclude-preview .cost{
  display:none !important;
}
#page-builder .played-card-tools .notice{
  overflow:visible !important;
}
#page-builder .built-deck{
  grid-template-columns:repeat(8, minmax(58px, 78px)) !important;
  justify-content:start !important;
}
#page-builder .built-deck .cimg{
  width:78px !important;
  height:102px !important;
  min-height:102px !important;
  max-height:102px !important;
  overflow:hidden !important;
}
#page-builder .built-deck .cimg img{
  object-fit:contain !important;

function sanitizeId(s){ return String(s||"hauptturnier").toLowerCase().replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "hauptturnier"; }
function blankDays(count=10){ return Array.from({length:count},(_,i)=>({title:`Spieltag ${i+1}`, date:"", time:"", note:""})); }
function emptyDeck(){return Array(8).fill("")}
function emptyDayDecks(){return Array.from({length:PLAYERS},()=>Array.from({length:DECKS_PER_PLAYER_PER_DAY},()=>emptyDeck()))}
function defaultState(){
  return {version:5,settings:{tournamentName:"Clash Format Turnier", dayCount:10, firstRoundDays:5},days:blankDays(10),players:["Lukas","Darell","Spieler 3","Spieler 4"],results:{},dayDecks:{},revision:0,updatedAt:Date.now(),updatedBy:clientId}
}
function ensureDays(s){
  const count = Math.max(1, Math.min(40, Number(s.settings?.dayCount || 10)));
  s.settings.dayCount = count;
  if(!Array.isArray(s.days)) s.days = [];
  for(let i=0;i<count;i++){
    if(!s.days[i]) s.days[i] = {title:`Spieltag ${i+1}`, date:"", time:"", note:""};
    s.days[i].title = s.days[i].title || `Spieltag ${i+1}`;
    s.days[i].date = s.days[i].date || "";
    s.days[i].time = s.days[i].time || "";
    s.days[i].note = s.days[i].note || "";
  }
  if(!s.dayDecks) s.dayDecks = {};
  return s;
}
function normDeckRaw(deck){const names=(deck||[]).map(n=>CARD_BY_NAME[n]?n:"").filter(Boolean); if(names.length!==8||new Set(names).size!==8)return ""; return names.map(n=>CARD_BY_NAME[n].key).sort().join("|")}
function migrateOldPerGameDecks(next){
  if(next.dayDecks && Object.keys(next.dayDecks).length) return next;
  if(!next.results) return next;
  next.dayDecks = next.dayDecks || {};
  for(let day=1; day<=Number(next.settings?.dayCount||10); day++){
    const pools = emptyDayDecks();
    const sigsByPlayer = Array.from({length:PLAYERS},()=>new Set());
    pairings().forEach((p,mi)=>{
      const m = next.results[`d${day}m${mi}`];
      if(!m || !Array.isArray(m.games)) return;
      m.games.forEach(g=>{
        ["a","b"].forEach(side=>{
          const pi = side==="a" ? p[0] : p[1];
          const deck = g.decks?.[side];
          const sig = normDeckRaw(deck||[]);
          if(sig && !sigsByPlayer[pi].has(sig) && sigsByPlayer[pi].size < DECKS_PER_PLAYER_PER_DAY){
            pools[pi][sigsByPlayer[pi].size] = [...deck];
            sigsByPlayer[pi].add(sig);
          }
        });
      });
    });
    if(sigsByPlayer.some(set=>set.size>0)) next.dayDecks[String(day)] = pools;
  }
  return next;
}
function migrate(s){
  const d=defaultState();
  let next = {...d,...s,settings:{...d.settings,...(s?.settings||{})},players:Array.isArray(s?.players)&&s.players.length===4?s.players:d.players,days:Array.isArray(s?.days)?s.days:d.days,results:s?.results||{},dayDecks:s?.dayDecks||{}};
  if(!Number.isFinite(Number(next.settings.dayCount))) next.settings.dayCount = 10;
  next.settings.dayCount = Math.max(1, Math.min(40, Number(next.settings.dayCount)));
  if(!Number.isFinite(Number(next.settings.firstRoundDays))) next.settings.firstRoundDays = Math.ceil(next.settings.dayCount/2);
  next.settings.firstRoundDays = Math.max(0, Math.min(next.settings.dayCount, Number(next.settings.firstRoundDays)));
  next = ensureDays(next);
  next = migrateOldPerGameDecks(next);
  for(const id of Object.keys(next.results||{})){
    const m=next.results[id];
    if(m?.games) m.games.forEach(g=>{ if(g.result==="draw") g.result=""; });
  }
  next.version = 5;
  return next;
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) return migrate(JSON.parse(raw));
    return migrate(JSON.parse(JSON.stringify(EMBEDDED_SAVE_STATE || defaultState())));
  }catch(e){
    return migrate(JSON.parse(JSON.stringify(EMBEDDED_SAVE_STATE || defaultState())));
  }
}

async function loadAutoDataJson(force=false){
  if(location.protocol === "file:"){
    updateSyncLabel("Lokale Datei · data.json wird erst online automatisch geladen");
    return false;
  }
  try{
    const res = await fetch(AUTO_DATA_URL + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok){
      updateSyncLabel("Keine data.json gefunden · lokaler Stand");
      return false;
    }

    const incoming = migrate(await res.json());
    const incomingStamp = JSON.stringify({
      revision: incoming.revision || 0,
      updatedAt: incoming.updatedAt || 0,
      results: Object.keys(incoming.results || {}).length,
      dayDecks: Object.keys(incoming.dayDecks || {}).length
    });
    const oldStamp = localStorage.getItem(AUTO_DATA_CACHE_KEY);

    if(force || oldStamp !== incomingStamp){
      isApplyingRemote = true;
      state = incoming;
      selectedDay = Math.min(selectedDay, dayCount());
      localStorage.setItem(AUTO_DATA_CACHE_KEY, incomingStamp);
      saveLocal();
      isApplyingRemote = false;
      renderAll();
      updateSyncLabel("data.json automatisch geladen");
      showToast("Aktueller Stand geladen");
      return true;
    }

    updateSyncLabel("data.json aktuell · lokaler Stand");
    return true;
  }catch(e){
    console.warn("data.json konnte nicht geladen werden", e);
    updateSyncLabel("data.json konnte nicht geladen werden");
    return false;
  }
}
function reloadAutoDataJson(){
  loadAutoDataJson(true);
}

function dayCount(){return Math.max(1, Math.min(40, Number(state.settings.dayCount||10)))}
function totalSingleGames(){return dayCount()*6*GAMES}
function phaseLabel(day){ const first=Number(state.settings.firstRoundDays||Math.ceil(dayCount()/2)); if(first<=0) return "Turnier"; if(day<=first) return "Hinrunde"; if(first<dayCount()) return "Rückrunde"; return "Turnier"; }
function dayMeta(day){ ensureDays(state); return state.days[day-1] || {title:`Spieltag ${day}`,date:"",time:"",note:""}}
function dayLabel(day){ const d=dayMeta(day); return d.title || `Spieltag ${day}`; }
function formatDayDate(day){const d=dayMeta(day), parts=[]; if(d.date){ try{ parts.push(new Date(d.date+"T00:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})); }catch(e){parts.push(d.date)} } if(d.time) parts.push(d.time+" Uhr"); return parts.join(" · ");}
function saveLocal(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateSyncLabel(); updateTitle();}
function bump(render=true){ if(isApplyingRemote) return; state.revision=(state.revision||0)+1; state.updatedAt=Date.now(); state.updatedBy=clientId; ensureDays(state); saveLocal(); scheduleCloudSave(); if(render) renderLight();}

function updateSyncLabel(msg){ const el=document.getElementById("syncState"); if(!el) return; const d=new Date(state.updatedAt||Date.now()).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}); if(msg) el.textContent=msg+" · Turnier: "+tournamentId; else el.textContent=(cloudMode&&remoteReady?"Online synchronisiert":"Lokal gespeichert")+" · "+d+" · Turnier: "+tournamentId;}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]))}
function pairings(){return [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]]}
function mid(day,mi){return `d${day}m${mi}`} function emptyMatch(){return {games:Array.from({length:GAMES},()=>({result:""}))}}
function getMatch(day,mi){const id=mid(day,mi); if(!state.results[id]) state.results[id]=emptyMatch(); const m=state.results[id]; if(!m.games||m.games.length!==GAMES)m.games=emptyMatch().games; for(const g of m.games){ if(g.result==="draw") g.result=""; if(typeof g.result !== "string") g.result=""; } return m}
function getDayDecks(day){
  ensureDays(state); const k=String(day); if(!state.dayDecks[k]) state.dayDecks[k]=emptyDayDecks(); const dd=state.dayDecks[k];
  while(dd.length<PLAYERS) dd.push(Array.from({length:DECKS_PER_PLAYER_PER_DAY},()=>emptyDeck()));
  for(let p=0;p<PLAYERS;p++){ if(!Array.isArray(dd[p])) dd[p]=Array.from({length:DECKS_PER_PLAYER_PER_DAY},()=>emptyDeck()); while(dd[p].length<DECKS_PER_PLAYER_PER_DAY) dd[p].push(emptyDeck()); for(let d=0;d<DECKS_PER_PLAYER_PER_DAY;d++){ if(!Array.isArray(dd[p][d])) dd[p][d]=emptyDeck(); while(dd[p][d].length<8) dd[p][d].push(""); } }

function bEscArg(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function builderToggle(card,mode){
  if(mode==="include"){builderState.exclude=builderState.exclude.filter(x=>x!==card);builderState.include=builderState.include.includes(card)?builderState.include.filter(x=>x!==card):[...builderState.include,card];}
  else{builderState.include=builderState.include.filter(x=>x!==card);builderState.exclude=builderState.exclude.includes(card)?builderState.exclude.filter(x=>x!==card):[...builderState.exclude,card];}
  builderState.generated=null; renderBuilder();
}
function builderClear(mode){if(mode==="include")builderState.include=[]; if(mode==="exclude")builderState.exclude=[]; builderState.generated=null; renderBuilder();}
function builderAllowed(deck){const exc=new Set(builderState.exclude);return builderState.include.every(c=>deck.includes(c))&&deck.every(c=>!exc.has(c));}
function seededPick(list,seed){
  if(!list.length) return null;
  const x=Math.abs(Math.sin(seed*999.17+list.length*13.37));
  return list[Math.floor(x*list.length)%list.length];
}
function shuffleByAttempt(list,attempt){
  return [...list].sort((a,b)=>{
    const av=Math.sin((a.charCodeAt(0)||1)*12.9898 + attempt*78.233 + a.length*3.17);
    const bv=Math.sin((b.charCodeAt(0)||1)*12.9898 + attempt*78.233 + b.length*3.17);
    return av-bv;
  });
}
function buildHybridDeck(){
  const inc=[...new Set(builderState.include)].filter(c=>CARD_BY_NAME[c]);
  const exc=new Set(builderState.exclude);
  if(inc.length>8) return null;

  const allowedCards=CARDS.map(c=>c.name).filter(c=>!exc.has(c) && !inc.includes(c));
  const usableTemplates=PRO_DECKS.filter(d=>d.cards.some(c=>!exc.has(c)));

  const freq={};
  usableTemplates.forEach((d,idx)=>{
    const includeHits=inc.filter(c=>d.cards.includes(c)).length;
    const validCount=d.cards.filter(c=>CARD_BY_NAME[c]&&!exc.has(c)).length;
    d.cards.forEach(c=>{
      if(!CARD_BY_NAME[c] || exc.has(c) || inc.includes(c)) return;
      freq[c]=(freq[c]||0)+1+includeHits*4+validCount+(idx<8?2:0);
    });
  });

  let deck=[...inc];

  // Start from a rotating pro-template that best matches the criteria, so repeated clicks feel different.
  const rankedTemplates=usableTemplates
    .map((d,idx)=>({
      ...d,
      idx,
      score:d.cards.filter(c=>!exc.has(c)).length*2 + inc.filter(c=>d.cards.includes(c)).length*8
    }))
    .sort((a,b)=>b.score-a.score || ((a.idx+builderState.attempt)%7)-((b.idx+builderState.attempt)%7));

  const base=rankedTemplates.length ? rankedTemplates[builderState.attempt % rankedTemplates.length] : null;
  if(base){
    shuffleByAttempt(base.cards,builderState.attempt).forEach(c=>{
      if(deck.length<8 && CARD_BY_NAME[c] && !exc.has(c) && !deck.includes(c)) deck.push(c);
    });
  }

  // Fill remaining slots with weighted cards from professional templates.
  const weighted=[];
  Object.entries(freq).forEach(([c,w])=>{
    for(let i=0;i<Math.max(1,Math.min(12,w));i++) weighted.push(c);
  });
  shuffleByAttempt(weighted,builderState.attempt+3).forEach(c=>{
    if(deck.length<8 && !deck.includes(c)) deck.push(c);
  });

  // Last fallback: any allowed card.
  shuffleByAttempt(allowedCards,builderState.attempt+11).forEach(c=>{
    if(deck.length<8 && !deck.includes(c)) deck.push(c);
  });

  return deck.length===8?{
    name:"Neuer Hybrid-Vorschlag",
    source:"aus Profi-Deck-Vorlagen neu kombiniert",
    cards:deck,
    hybrid:true
  }:null;
}
function buildDeckSuggestion(next=false){
  // Wichtig: Auch ein erneuter Klick auf „Deck bauen“ soll nach einem vorhandenen Vorschlag
  // ein neues Deck mit denselben Kriterien erzeugen.
  if(next || builderState.generated) builderState.attempt++;
  if(builderState.include.length>8){showToast("Zu viele Pflichtkarten");return;}
  if(builderState.include.some(c=>builderState.exclude.includes(c))){
    showToast("Eine Karte ist gleichzeitig Pflicht und ausgeschlossen");
    return;
  }

  const cands=PRO_DECKS
    .filter(d=>d.cards.every(c=>CARD_BY_NAME[c])&&builderAllowed(d.cards));

  if(cands.length>1){
    const picked=cands[builderState.attempt % cands.length];
    builderState.generated={...picked};
    renderBuilder();
    return;
  }

  if(cands.length===1 && !builderState.generated){
    builderState.generated={...cands[0]};
    renderBuilder();
    return;
  }

  // Wenn nur ein exaktes Profi-Deck passt oder der Nutzer ein weiteres Deck möchte,
  // wird ein neuer Hybrid-Vorschlag gebaut, der Pflicht-/Ausschlusskarten weiterhin beachtet.
  const h=buildHybridDeck();
  if(h){builderState.generated=h;renderBuilder();return;}

  if(cands.length===1){
    builderState.generated={...cands[0]};
    renderBuilder();
    return;
  }

  showToast("Mit diesen Kriterien konnte kein Deck gebaut werden");
}

function builderGrid(mode){const selected=new Set(mode==="include"?builderState.include:builderState.exclude);const other=new Set(mode==="include"?builderState.exclude:builderState.include);return `<div class="builder-card-grid">${CARDS.map(c=>{const cls=selected.has(c.name)?mode:(other.has(c.name)?"exclude":"");const mark=selected.has(c.name)?(mode==="include"?"MUSS":"RAUS"):"";return `<button class="builder-card-choice ${cls}" onclick="builderToggle('${bEscArg(c.name)}','${mode}')">${mark?`<span class="mark">${mark}</span>`:""}${cardHtml(c.key)}<b>${esc(c.name)}</b></button>`;}).join("")}</div>`;}

}

  wire();
  renderAll();
  initFirebase();
  loadAutoDataJson(false);
}catch(e){
  console.error(e);
  const el=document.getElementById("syncState");
  if(el) el.textContent="Fehler beim Laden: " + (e && e.message ? e.message : e);
  const main=document.querySelector(".app");
  if(main) main.innerHTML='<div class="panel"><div class="head"><div><h2>Fehler beim Laden</h2><p>Bitte index.html und data.json erneut hochladen.</p></div></div><div class="body"><div class="notice danger">'+String(e && e.message ? e.message : e)+'</div></div></div>';
}

</script>
</body>
</html>
